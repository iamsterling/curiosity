name: OpenCode2 private CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-linux:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify:linux
        working-directory: apps/plugin/opencode2

  container-smoke-local:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: node tools/ephemeral-container.mjs smoke --local-fixture
        working-directory: apps/plugin/opencode2

  container-smoke-private-git:
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: credentials
        name: Prepare ephemeral Git credential file
        env:
          PRIVATE_GIT_TOKEN: ${{ secrets.OPENCODE2_PRIVATE_GIT_TOKEN }}
          PRIVATE_GIT_URL: ${{ vars.OPENCODE2_PRIVATE_GIT_URL }}
          PRIVATE_GIT_REF: ${{ vars.OPENCODE2_PRIVATE_GIT_REF }}
        run: |
          if [ -z "$PRIVATE_GIT_TOKEN" ] || [ -z "$PRIVATE_GIT_URL" ] || [ -z "$PRIVATE_GIT_REF" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Private-Git smoke NOT RUN: URL, ref, or token is unavailable."
            exit 0
          fi
          umask 077
          printf '%s' "$PRIVATE_GIT_TOKEN" > "$RUNNER_TEMP/opencode2-git-token"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - if: steps.credentials.outputs.available == 'true'
        env:
          OPENCODE2_GIT_REF: ${{ vars.OPENCODE2_PRIVATE_GIT_REF }}
          OPENCODE2_GIT_TOKEN_FILE: ${{ runner.temp }}/opencode2-git-token
          OPENCODE2_GIT_URL: ${{ vars.OPENCODE2_PRIVATE_GIT_URL }}
        run: node tools/ephemeral-container.mjs smoke
        working-directory: apps/plugin/opencode2
      - if: always()
        run: rm -f "$RUNNER_TEMP/opencode2-git-token"

  container-stress-local:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: node tools/ephemeral-container.mjs stress --local-fixture
        working-directory: apps/plugin/opencode2

  container-stress-private-git:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: credentials
        name: Prepare ephemeral Git credential file
        env:
          PRIVATE_GIT_TOKEN: ${{ secrets.OPENCODE2_PRIVATE_GIT_TOKEN }}
          PRIVATE_GIT_URL: ${{ vars.OPENCODE2_PRIVATE_GIT_URL }}
          PRIVATE_GIT_REF: ${{ vars.OPENCODE2_PRIVATE_GIT_REF }}
        run: |
          if [ -z "$PRIVATE_GIT_TOKEN" ] || [ -z "$PRIVATE_GIT_URL" ] || [ -z "$PRIVATE_GIT_REF" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Private-Git stress NOT RUN: URL, ref, or token is unavailable."
            exit 0
          fi
          umask 077
          printf '%s' "$PRIVATE_GIT_TOKEN" > "$RUNNER_TEMP/opencode2-git-token"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - if: steps.credentials.outputs.available == 'true'
        env:
          OPENCODE2_GIT_REF: ${{ vars.OPENCODE2_PRIVATE_GIT_REF }}
          OPENCODE2_GIT_TOKEN_FILE: ${{ runner.temp }}/opencode2-git-token
          OPENCODE2_GIT_URL: ${{ vars.OPENCODE2_PRIVATE_GIT_URL }}
        run: node tools/ephemeral-container.mjs stress
        working-directory: apps/plugin/opencode2
      - if: always()
        run: rm -f "$RUNNER_TEMP/opencode2-git-token"
