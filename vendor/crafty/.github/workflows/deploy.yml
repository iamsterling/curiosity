name: build-and-deploy

# The deploy loop: on every push to main, the self-hosted runner (the VPS —
# the same amd64 host the images must run on) builds the three zone images
# from the shared Dockerfile builder stage, pushes them to the Dokploy
# registry, and triggers the three applications to redeploy from the new
# tags. The apps never build server-side; they only pull.
#
# Vars (repository settings → Actions → Variables):
#   REGISTRY_URL       registry hostname (no scheme)
#   EDITOR_APP_ID      Dokploy applicationId of crafty-editor
#   ADMIN_APP_ID       Dokploy applicationId of crafty-admin
#   BASE_APP_ID        Dokploy applicationId of crafty-base
#   EDITOR_HOST        Docker-network hostname of the editor service (its appName)
#   ADMIN_HOST         Docker-network hostname of the admin service (its appName)
# Secrets:
#   REGISTRY_USERNAME / REGISTRY_PASSWORD   registry credentials
#   DOKPLOY_URL / DOKPLOY_TOKEN             Dokploy API (x-api-key)

on:
  push:
    branches: [main]
    # Docs and the local compose never touch the deployed images.
    paths-ignore:
      - 'docs/**'
      - 'deploy/**'
      - 'openspec/**'
      - 'compose.yaml'
      - '*.md'

concurrency:
  group: crafty-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Login to the Dokploy registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ vars.REGISTRY_URL }}" \
            -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      # The base's rewrites are baked into its routes manifest at build time,
      # so the editor/admin Docker-network hostnames are build args for the
      # base image only.
      - name: Build the zone images
        run: |
          docker build --target base \
            --build-arg ZONE_EDITOR_URL="http://${{ vars.EDITOR_HOST }}:3000" \
            --build-arg ZONE_ADMIN_URL="http://${{ vars.ADMIN_HOST }}:3000" \
            -t "${{ vars.REGISTRY_URL }}/crafty-base:latest" .
          docker build --target editor -t "${{ vars.REGISTRY_URL }}/crafty-editor:latest" .
          docker build --target admin -t "${{ vars.REGISTRY_URL }}/crafty-admin:latest" .

      - name: Push the images
        run: |
          for image in crafty-base crafty-editor crafty-admin; do
            docker push "${{ vars.REGISTRY_URL }}/${image}:latest"
          done

      - name: Trigger the Dokploy redeploys
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
        run: |
          for app in "${{ vars.BASE_APP_ID }}" "${{ vars.EDITOR_APP_ID }}" "${{ vars.ADMIN_APP_ID }}"; do
            curl -sf -X POST "${DOKPLOY_URL}/api/trpc/application.deploy" \
              -H "x-api-key: ${DOKPLOY_TOKEN}" \
              -H "content-type: application/json" \
              -d "{\"json\":{\"applicationId\":\"${app}\"}}"
          done
